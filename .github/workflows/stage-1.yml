name: Concordia verification (stages 1–5)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-1.yml'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-*.yaml'
      - 'eslint.config.js'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Run regression tests with fake connections
        run: pnpm test
      - name: Typecheck and build
        run: pnpm build
