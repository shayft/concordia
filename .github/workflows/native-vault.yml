name: Native credential stores

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-vault.yml'
      - 'packages/providers/test-native/**'
      - 'packages/providers/src/credentials.ts'
      - 'packages/providers/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  vault:
    name: Native vault on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked vault dependencies
        run: pnpm --filter @concordia/providers... install --frozen-lockfile
      - name: Install a Secret Service for the private D-Bus session
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          gnome-keyring-daemon --version
          dbus-run-session --version
      - name: Verify native write, read and removal
        run: node packages/providers/test-native/vault.ts
