name: Official CLI compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &cli_sources
      - '.github/workflows/official-cli.yml'
      - 'packages/runtimes/test-native/**'
      - 'packages/runtimes/src/**'
      - 'packages/runtimes/package.json'
      - 'apps/server/src/verify.ts'
      - 'apps/server/package.json'
      - 'packages/providers/src/**'
      - 'packages/protocol/src/**'
      - 'packages/store/src/paths.ts'
      - 'packages/store/src/private-directory.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [main]
    paths: *cli_sources

permissions:
  contents: read

jobs:
  inspect:
    name: Signed-out CLI inspection on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install frozen dependencies for the verifier
        run: pnpm install --frozen-lockfile
      - name: Inspect official Claude Code and Codex in isolated accounts
        run: node --use-env-proxy packages/runtimes/test-native/inspect.ts
